# Default configuration. Every key here is also a command-line override, e.g.
#   python train.py --shape wedge --perception circular --epochs 500
#
# Units are physical: 1 simulation unit = 1 meter, dt is in seconds.

# --- swarm / sensing ---
n: 4                    # drones (the study is fixed at four)
dt: 0.1                 # integration timestep, seconds (10 Hz)
perception: cone        # "cone" (forward FOV) or "circular" (360-degree)
half_angle_deg: 75.0    # cone half-angle => 150 deg total field of view
sensing_range: 1.2      # sensing radius, meters (both perception models)

# --- actuation envelope (what a Crazyflie can physically do, not control logic) ---
max_speed: 1.0          # m/s, forward only: speed is clamped to [0, max_speed]
max_accel: 2.0          # m/s^2, forward acceleration (tilt-limited)
max_yaw_rate_deg: 180.0   # deg/s
max_yaw_accel_deg: 360.0  # deg/s^2

# --- initial conditions ---
init_box: 1.0           # half-width of the random start box, meters
min_start_dist: 0.5     # resample any start with a pair closer than this
drone_radius: 0.1       # safety-disk radius; a COLLISION is centers < 2*this

# --- model (gamma) ---
hidden: 128             # update-MLP width
msg_dim: 128            # message embedding width
a_lin_scale: 1.0        # output scaling, forward accel
a_ang_scale: 1.0        # output scaling, yaw accel

# --- training ---
epochs: 2000
batch_size: 128         # independent swarms per step (one batched rollout)
lr: 0.003
lr_min: 0.0003          # cosine-annealed floor (set equal to lr to disable)
t_min: 40               # min BPTT horizon, randomized per epoch (4 s)
t_max: 120              # max BPTT horizon (12 s)
hold_tail: 10           # formation loss averages over this many final steps
grad_clip: 1.0

# --- loss ---
separation_weight: 10.0   # soft tier: exposure below 2*drone_radius + margin
collision_weight: 100.0   # hard tier: exposure below 2*drone_radius itself
separation_margin: 0.1    # soft-tier buffer beyond the collision distance
separation_ramp: 0.5      # ramp both tiers 0 -> full over this fraction of training

# --- misc ---
seed: 0
shape: square           # which formation this network is trained for
shape_scale: 0.8        # target size, meters
checkpoint: checkpoint.pt
