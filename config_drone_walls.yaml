# Drone-deployment preset, issue #4 METHOD 2: REPULSIVE WALLS.
# The formation loss stays position/rotation INVARIANT (form the shape anywhere,
# any orientation), and containment is physical instead: each wall of the
# 3m x 3m flight area pushes a drone toward the center with an acceleration
# inversely proportional to its wall distance once it comes within wall_margin,
# so drones bounce off the boundary (see sim.wall_accel). The wall force is
# differentiable and active during BPTT, so the model trains through the bounces.
# Units: 1 unit = 1 meter.
#
#   python train.py --config config_drone_walls.yaml
#   python make_results.py --config config_drone_walls.yaml --checkpoint checkpoint_drone_walls.pt --label drone_walls
#
# Deviations from config.yaml: arena_mode (walls), n (8), shape_scale (0.8),
# perception (circular, range 1.2) -- same reasoning as config_drone_fixed.yaml,
# which is identical to this file except arena_mode/bounds_weight/checkpoint.
# bounds_weight stays 0 here: containment is the walls' job, not the loss's.

# --- swarm / simulation ---
n: 8
dt: 0.1
drag: 0.02
perception: circular
half_angle_deg: 75.0
sensing_range: 1.2
init_box: 1.0
init_vel_std: 0.05
speed_eps: 0.001
heading_smoothing: 0.2
self_rotation_deg: 15.0

# --- drone flight area (issue #4) ---
arena_mode: walls
arena_half: 1.5
wall_margin: 0.3
wall_strength: 0.5
bounds_weight: 0.0

# --- collision avoidance (issue #4) ---
drone_radius: 0.1
separation_weight: 30.0
separation_margin: 0.08
min_start_dist: 0.3

# --- model ---
hidden: 128
msg_dim: 128
z_dim: 8
id_dim: 8
accel_scale: 1.0

# --- training ---
epochs: 3000
batch_size: 128
lr: 0.003
lr_min: 0.0003
t_min: 40
t_max: 120
damping_weight: 0.1
damping_tail: 5
hold_tail: 10
grad_clip: 1.0

# --- replay cache ---
replay_size: 256
replay_prob: 0.5
replay_fresh: 1

# --- loss ---
use_chamfer: false

# --- misc ---
seed: 0
shape_scale: 0.8
checkpoint: checkpoint_drone_walls.pt
